<main class="login">
  <aside class="lado" aria-hidden="true">
    <img src="assets/fotos/hamburgueria.jpg" alt="" />
    <div class="lado__texto">
      <span class="lado__marca">Rende</span>
      <p>O pedido é seu, <br />o dinheiro também.</p>
    </div>
  </aside>

  <div class="area">
    <a class="voltar" routerLink="/">Voltar para o site</a>

    <form class="caixa" [formGroup]="form" (ngSubmit)="entrar()" novalidate appRevelar>
      <p class="marca">Rende</p>
      <h1>Entrar no painel</h1>
      <p class="texto-suave">Pedidos, recebíveis e cobranças do seu restaurante num lugar só.</p>

      <app-campo para="email" rotulo="E-mail" [obrigatorio]="true" [controle]="form.controls.email">
        <input id="email" class="controle" type="email" autocomplete="username" formControlName="email"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" />
      </app-campo>

      <app-campo para="senha" rotulo="Senha" [obrigatorio]="true" dica="Mínimo de 6 caracteres" [controle]="form.controls.senha">
        <input id="senha" class="controle" type="password" autocomplete="current-password" formControlName="senha"
          [attr.aria-invalid]="form.controls.senha.invalid && form.controls.senha.touched" />
      </app-campo>

      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }

      <button appBotao type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando...' : 'Entrar' }}
      </button>
      <p class="demo">Demonstração: qualquer e-mail válido e senha com 6 ou mais caracteres.</p>
    </form>
  </div>
</main>
